name: Pages

# Deploy docs/ to GitHub Pages only after CI passes on a push to main.
# Requires Settings -> Pages -> Source: GitHub Actions.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A CI run for an older commit can finish after a newer one; deploy only
      # the commit that is still the head of main.
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is now at $head; not deploying $SHA"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.latest == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.current.outputs.latest == 'true'
        uses: actions/configure-pages@v5
      - if: steps.current.outputs.latest == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        if: steps.current.outputs.latest == 'true'
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: x86-sha-ni
          - os: ubuntu-24.04-arm
            backend: armv8-sha2
          - os: macos-latest
            backend: armv8-sha2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Full test suite
        run: make test
      - name: Require hardware backend agreement
        shell: bash
        env:
          EXPECTED_BACKEND: ${{ matrix.backend }}
        run: |
          target/release/leanseal selftest | tee selftest.log
          grep -Eq "^backend ${EXPECTED_BACKEND}[[:space:]]+ok$" selftest.log
      - name: Portable CLI and cross tests
        env:
          LEANSEAL_BACKEND: portable
        run: |
          sh tests/cli.sh
          sh tests/cross.sh
      - name: Test the packaged crate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo package --no-verify --allow-dirty
          mkdir pkg && tar xzf target/package/leanseal-*.crate -C pkg
          cd pkg/leanseal-* && cargo test --release

  msrv:
    name: Build with MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              print("version=" + tomllib.load(manifest)["package"]["rust-version"])
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build all targets with MSRV
        run: cargo build --release --all-targets --locked

  poc:
    name: Proof of concept
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc/node
      - name: Contract format and tests
        working-directory: poc/contracts
        run: |
          forge fmt --check
          forge test
      - name: Node clippy and tests
        working-directory: poc/node
        run: |
          cargo clippy --release --all-targets --locked -- -D warnings
          cargo test --release --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Core crate
        run: cargo audit --deny warnings
      # RUSTSEC-2026-0387 (crypto-bigint 0.5) reaches the node through alloy's
      # k256 0.13, and alloy 2.5.0, the latest release, has no version without
      # it. Remove the exception once alloy moves to k256 0.14.
      - name: Proof-of-concept node
        run: cargo audit --file poc/node/Cargo.lock --ignore RUSTSEC-2026-0387

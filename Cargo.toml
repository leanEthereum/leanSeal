[package]
name = "leanseal"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Chained-hash time-lock puzzles and authenticated encryption using SHA-256"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leanEthereum/leanSeal"
readme = "README.md"
authors = ["Vitalik Buterin", "Quang Dao", "Justin Drake"]
keywords = ["time-lock", "encryption", "sha256", "cryptography"]
categories = ["cryptography", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/**/*.rs",
    "/tests/*.rs",
    "/tests/*.sh",
    "/tests/vectors.json",
    "/ref/leanseal_ref.py",
    "/Makefile",
    "/demo.sh",
    "/SPEC.md",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
getrandom = "0.2"
signal-hook = "0.3"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
